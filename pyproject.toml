[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cucumbers-swagents"
version = "0.1.0"
description = "Deep-agent orchestrator for solving platform.brojs.ru tasks via MCP"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "fastapi>=0.136.1",
]

[project.scripts]
swagents = "orchestrator.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.hatch.build]
sources = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
